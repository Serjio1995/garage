<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GARAGE</title>
  <meta name="description" content="Онлайн-запись в автосервис без звонков" />
  <meta name="theme-color" content="#0A0A0B" />
  <!-- Installed from the home screen: open full-screen, without the browser bar -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GARAGE" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link id="app-manifest" rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="core.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:      #0A0A0A;
      --bg2:     #111111;
      --bg3:     #1A1A1A;
      --bg4:     #242424;
      --accent:  #CCFF00;
      --cyan:    #00E5FF;
      --white:   #FFFFFF;
      --gray:    #8E8E93;
      --border:  rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.16);
    }

    html, body { height: 100%; background: var(--bg); color: var(--white); font-family: 'Inter', sans-serif; font-size: 14px; overflow: hidden; overscroll-behavior: none; }

    #root { display: flex; flex-direction: column; height: 100dvh; height: 100vh; overflow: hidden; background: var(--bg); }

    ::-webkit-scrollbar { width: 2px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    .mono { font-family: 'JetBrains Mono', monospace; }
    .label { font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gray); }

    .tab-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .screen { padding: 0 0 32px; animation: slideUp .38s cubic-bezier(.16,1,.3,1) both; }
    .px { padding-left: 16px; padding-right: 16px; }

    /* ── Bottom Nav ── */
    .nav { height: 68px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom, 0); flex-shrink: 0; position: relative; z-index: 10; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; background: none; border: none; color: var(--gray); transition: color .18s, transform .12s; padding: 0; position: relative; user-select: none; }
    .nav-btn:active { transform: scale(.9); }
    .nav-btn.on { color: var(--accent); }
    .nav-btn.on::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 28px; height: 2px; background: var(--accent); }
    .nav-icon { font-size: 19px; line-height: 1; }
    .nav-label { font-size: 8.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

    .top-line { height: 1px; flex-shrink: 0; background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%); opacity: .35; }

    /* ── Buttons ── */
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; border: none; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; transition: transform .12s cubic-bezier(.16,1,.3,1), background .12s, opacity .15s; outline: none; border-radius: 0; }
    .btn:active { transform: scale(.97); }
    .btn-primary  { background: var(--accent); color: #000; padding: 17px 20px; }
    .btn-primary:active { background: #b8e600; }
    .btn-ghost { background: transparent; color: var(--white); padding: 14px 20px; border: 1px solid var(--border2); }
    .btn-ghost:active { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 10px 16px; font-size: 11px; }
    .btn[disabled] { opacity: .3; pointer-events: none; }

    .card { background: var(--bg2); border: 1px solid var(--border); }

    .spec-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--border); }
    .spec-row:last-child { border-bottom: none; }

    .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: dotPulse 2s infinite; }

    .pbar { height: 3px; background: var(--bg4); overflow: hidden; }
    .pfill { height: 100%; background: var(--accent); transition: width 1.2s cubic-bezier(.16,1,.3,1); }

    .check-item { display: flex; align-items: center; gap: 14px; padding: 14px 14px; border: 1px solid var(--border); cursor: pointer; margin-bottom: 2px; transition: border-color .15s, background .15s, transform .1s; }
    .check-item:active { transform: scale(.985); }
    .check-item.on { border-color: var(--accent); background: rgba(255,255,255,.04); }
    .checkbox { width: 20px; height: 20px; border: 1.5px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .15s; }
    .checkbox.on { border-color: var(--accent); background: var(--accent); color: #000; }

    .cat-btn { padding: 18px 13px; border: 1px solid var(--border); background: var(--bg2); cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; transition: border-color .15s, background .15s, transform .12s; font-family: 'Inter', sans-serif; }
    .cat-btn:active, .cat-btn.on { transform: scale(.965); border-color: var(--accent); background: rgba(255,255,255,.05); }

    .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 2px; transition: background .12s, transform .1s; }
    .cal-day:active { transform: scale(.82); }
    .cal-day.avail:hover { background: var(--bg3); }
    .cal-day.sel { background: var(--accent); color: #000; font-weight: 700; }
    .cal-day.na { color: var(--bg4); pointer-events: none; text-decoration: line-through; }
    .cal-day.today { color: var(--accent); font-weight: 700; }
    .cal-day.past { color: var(--bg4); pointer-events: none; }

    .tslot { padding: 9px 6px; border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer; text-align: center; transition: all .14s; }
    .tslot:active { transform: scale(.88); }
    .tslot.sel { border-color: var(--accent); background: rgba(255,255,255,.08); color: var(--accent); }
    .tslot.na { opacity: .22; pointer-events: none; }

    .tline-item { position: relative; padding-left: 22px; padding-bottom: 26px; }
    .tline-item::before { content: ''; position: absolute; left: 4px; top: 10px; bottom: 0; width: 1px; background: var(--border); }
    .tline-item:last-child::before { display: none; }
    .tline-dot { position: absolute; left: 0; top: 7px; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--border2); background: var(--bg4); }
    .tline-dot.on { border-color: var(--accent); background: var(--accent); }

    .lcard { background: linear-gradient(135deg, #191919 0%, #0c0c0c 55%, #161616 100%); border: 1px solid rgba(255,255,255,.11); padding: 22px 20px; position: relative; overflow: hidden; }
    .lcard::before { content: ''; position: absolute; top: -50%; right: -15%; width: 55%; height: 200%; background: linear-gradient(180deg, transparent, rgba(255,255,255,.04) 50%, transparent); transform: rotate(18deg); pointer-events: none; }
    .tier-badge { display: inline-block; padding: 3px 8px; background: var(--accent); color: #000; font-size: 9px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }

    .ref-box { display: flex; align-items: center; gap: 10px; background: var(--bg3); border: 1px solid var(--border); padding: 13px 14px; }

    .expandable { overflow: hidden; transition: max-height .38s cubic-bezier(.16,1,.3,1); max-height: 0; }
    .expandable.open { max-height: 480px; }

    .sdot { height: 6px; border-radius: 3px; background: var(--bg4); transition: width .3s cubic-bezier(.16,1,.3,1), background .25s; }
    .sdot.on { background: var(--accent); width: 24px !important; }
    .sdot.done { background: rgba(255,255,255,.5); }

    .toast { position: fixed; bottom: 82px; left: 50%; z-index: 99; transform: translateX(-50%) translateY(14px); background: var(--accent); color: #000; padding: 10px 22px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border-radius: 2px; pointer-events: none; opacity: 0; transition: opacity .25s, transform .3s cubic-bezier(.16,1,.3,1); white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .skel { background: linear-gradient(90deg, var(--bg3) 25%, var(--bg4) 50%, var(--bg3) 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite; }

    .gridbg { background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px); background-size: 36px 36px; }

    /* ── Car stage ── */
    .car-stage { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
    .car-stage svg { width: 230px; filter: drop-shadow(0 6px 22px rgba(255,255,255,.18)); }
    .car-stage img { width: 100%; height: 100%; object-fit: cover; opacity: .88; filter: brightness(.85) contrast(1.1); }
    .scan-line { position: absolute; left: 0; right: 0; top: -2px; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: scan 3.5s linear infinite; pointer-events: none; z-index: 2; }
    .car-stage-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,.6) 100%); z-index: 1; pointer-events: none; }
    .edit-car-btn { position: absolute; top: 10px; right: 10px; z-index: 3; background: rgba(0,0,0,.65); border: 1px solid var(--border2); color: var(--white); padding: 6px 10px; font-size: 10px; font-weight: 700; letter-spacing: .1em; cursor: pointer; font-family: 'Inter', sans-serif; backdrop-filter: blur(6px); transition: border-color .15s, color .15s; }
    .edit-car-btn:active { border-color: var(--accent); color: var(--accent); transform: scale(.95); }

    /* ── Top bar: brand · mode · language ── */
    .topbar { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--bg); }
    .brand { font: 700 12px/1 'JetBrains Mono', monospace; letter-spacing: .14em; margin-right: auto; white-space: nowrap; }
    .brand b { color: var(--accent); }
    .seg { display: flex; background: var(--bg2); border: 1px solid var(--border2); }
    .seg button { position: relative; padding: 6px 9px; font: 700 9.5px/1 'Inter', sans-serif; letter-spacing: .1em; background: none; border: none; color: var(--gray); cursor: pointer; transition: all .15s; }
    .seg button:active { transform: scale(.92); }
    .seg button.on { background: var(--accent); color: #000; }
    .badge { position: absolute; top: -7px; right: -7px; min-width: 16px; height: 16px; border-radius: 8px; background: #FF3B30; color: #fff; font: 700 9px/16px 'Inter', sans-serif; padding: 0 4px; text-align: center; letter-spacing: 0; }
    .nav-badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 15px; height: 15px; border-radius: 8px; background: #FF3B30; color: #fff; font: 700 8.5px/15px 'Inter', sans-serif; padding: 0 4px; }

    /* ── Date strip ── */
    .dstrip { display: flex; gap: 4px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px 2px; scrollbar-width: none; }
    .dstrip::-webkit-scrollbar { display: none; }
    .dchip { flex: 0 0 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0; border: 1px solid var(--border); background: var(--bg2); color: var(--white); cursor: pointer; font-family: 'Inter', sans-serif; transition: all .15s; }
    .dchip:active { transform: scale(.92); }
    .dchip.sel { border-color: var(--accent); background: var(--accent); color: #000; }
    .dchip.off { opacity: .35; }
    .dchip.off.sel { opacity: 1; background: var(--bg4); color: var(--white); border-color: var(--border2); }
    .dchip-wd { font-size: 8.5px; font-weight: 700; letter-spacing: .1em; opacity: .7; }
    .dchip-d { font-size: 17px; font-weight: 700; line-height: 1; }
    .dchip-m { font-size: 8px; font-weight: 700; letter-spacing: .08em; opacity: .6; }

    /* ── Chips / status ── */
    .chip { display: inline-block; padding: 3px 7px; font-size: 9px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--border2); color: var(--gray); white-space: nowrap; }
    .chip.new { border-color: rgba(255,150,0,.5); color: #FF9F0A; background: rgba(255,150,0,.08); }
    .chip.ok  { border-color: var(--accent); color: var(--accent); background: rgba(255,255,255,.06); }
    .chip.off { text-decoration: line-through; }
    .chip.ai  { border-color: rgba(0,229,255,.4); color: var(--cyan); }
    .link-btn { background: none; border: none; color: var(--gray); cursor: pointer; font: 11px 'Inter', sans-serif; padding: 0; }

    /* ── AI assistant ── */
    .ai-card { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px; margin-bottom: 18px; border: 1px solid rgba(0,229,255,.35); background: linear-gradient(135deg, rgba(0,229,255,.08), rgba(255,255,255,.03)); cursor: pointer; color: var(--white); font-family: inherit; text-align: left; transition: transform .12s; }
    .ai-card:active { transform: scale(.98); }
    .chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
    .msg { max-width: 88%; padding: 10px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; animation: fadeIn .25s ease both; }
    .msg.ai { align-self: flex-start; background: var(--bg3); border: 1px solid var(--border); }
    .msg.me { align-self: flex-end; background: var(--accent); color: #000; font-weight: 500; }
    .offer { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; white-space: normal; }
    .typing span { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gray); margin-right: 4px; animation: dotPulse 1s infinite; }
    .ai-chips { display: flex; gap: 6px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
    .ai-chips::-webkit-scrollbar { display: none; }
    .ai-chips button { flex-shrink: 0; padding: 8px 11px; border: 1px solid var(--border2); background: none; color: var(--white); font: 500 11.5px 'Inter', sans-serif; cursor: pointer; white-space: nowrap; }
    .chat-input { display: flex; gap: 6px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); }

    /* ── Owner: timeline ── */
    .tl { display: flex; border: 1px solid var(--border); background: var(--bg2); }
    .tl-hours { width: 40px; flex-shrink: 0; position: relative; border-right: 1px solid var(--border); }
    .tl-hour { position: absolute; left: 5px; font: 9px 'JetBrains Mono', monospace; color: var(--gray); transform: translateY(-50%); }
    .tl-col { flex: 1; min-width: 0; position: relative; border-right: 1px solid var(--border); }
    .tl-col:last-child { border-right: none; }
    .tl-head { height: 28px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-bottom: 1px solid var(--border); font-size: 9.5px; font-weight: 700; letter-spacing: .1em; }
    .tl-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
    .tl-block { position: absolute; left: 3px; right: 3px; padding: 4px 6px; font-size: 10px; line-height: 1.3; overflow: hidden; border-left: 2px solid var(--accent); background: rgba(255,255,255,.1); }
    .tl-block.new { border-left-color: #FF9F0A; background: rgba(255,150,0,.13); }
    .tl-block.block { border-left-color: var(--gray); background: repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 6px, transparent 6px 12px); display: flex; align-items: center; justify-content: center; }

    /* ── Owner: controls ── */
    .stepper { display: flex; align-items: center; border: 1px solid var(--border2); }
    .stepper button { width: 34px; height: 32px; background: none; border: none; color: var(--white); font-size: 16px; cursor: pointer; }
    .stepper span { width: 28px; text-align: center; font: 700 13px 'JetBrains Mono', monospace; }
    .mini-field { background: var(--bg3); border: 1px solid var(--border2); color: var(--white); padding: 7px 8px; font: 12px 'JetBrains Mono', monospace; width: 100%; border-radius: 0; outline: none; -webkit-appearance: none; appearance: none; }
    .mini-field:focus { border-color: var(--accent); }
    .toggle { width: 40px; height: 22px; border-radius: 11px; background: var(--bg4); border: none; position: relative; cursor: pointer; flex-shrink: 0; transition: background .2s; }
    .toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .toggle.on { background: var(--accent); }
    .toggle.on::after { transform: translateX(18px); background: #000; }
    .acc-head { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px; background: none; border: none; color: var(--white); font: 700 11.5px 'Inter', sans-serif; letter-spacing: .06em; cursor: pointer; }
    .svc-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
    .done-badge { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #000; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; margin-bottom: 18px; animation: scaleIn .4s cubic-bezier(.16,1,.3,1) both; }

    /* ── Car Setup Modal ── */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 50; display: flex; align-items: flex-end; animation: fadeIn .2s ease; }
    .modal-sheet { background: var(--bg2); width: 100%; border-radius: 12px 12px 0 0; border: 1px solid var(--border2); border-bottom: none; max-height: 92vh; overflow-y: auto; animation: sheetUp .38s cubic-bezier(.16,1,.3,1) both; padding-bottom: env(safe-area-inset-bottom, 16px); }
    .modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 4px; }

    /* ── Input ── */
    .field { background: var(--bg3); border: 1px solid var(--border2); color: var(--white); padding: 13px 14px; font-family: 'Inter', sans-serif; font-size: 14px; width: 100%; outline: none; transition: border-color .2s; border-radius: 0; }
    .field:focus { border-color: var(--accent); }
    .field::placeholder { color: var(--gray); font-size: 13px; }
    .field-label { font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gray); margin-bottom: 5px; display: block; }

    /* ── Image preview in modal ── */
    .img-preview { width: 100%; height: 160px; background: var(--bg3); border: 1px solid var(--border); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .img-preview img { width: 100%; height: 100%; object-fit: cover; }
    .img-preview .placeholder { color: var(--gray); font-size: 12px; text-align: center; padding: 16px; }

    /* ── TG User banner ── */
    .tg-banner { background: var(--bg3); border: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
    .tg-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--bg4); border: 1.5px solid var(--border2); overflow: hidden; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
    .tg-avatar img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Phone request button ── */
    .phone-req { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--border2); padding: 13px 14px; cursor: pointer; transition: border-color .15s, background .15s; background: none; width: 100%; font-family: 'Inter', sans-serif; color: var(--gray); }
    .phone-req:active { border-color: var(--accent); background: rgba(255,255,255,.04); }
    .phone-req.has-phone { border-style: solid; border-color: var(--accent); background: rgba(255,255,255,.04); color: var(--white); }

    /* ── Demo mode badge ── */
    .demo-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; background: rgba(255,150,0,.12); border: 1px solid rgba(255,150,0,.3); color: rgba(255,150,0,.9); font-size: 9px; font-weight: 700; letter-spacing: .1em; }

    /* ── Spinner ── */
    .spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

    /* ── Animations ── */
    @keyframes slideUp   { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes sheetUp   { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes dotPulse  { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.5; transform:scale(.85); } }
    @keyframes shimmer   { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
    @keyframes fadeIn    { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn   { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
    @keyframes spin      { to { transform: rotate(360deg); } }
    @keyframes scan      { 0% { top:-2px; opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { top:100%; opacity:0; } }

    /* ═════════════ MATTE BLACK THEME (overrides everything above) ═════════════ */
    :root {
      --bg:      #0A0A0B;
      --bg2:     #141416;
      --bg3:     #1B1B1E;
      --bg4:     #2A2A2E;
      --accent:  #F4F4F5;
      --cyan:    #9DB8FF;
      --white:   #F4F4F5;
      --gray:    #8A8A90;
      --ok:      #34D27B;
      --warn:    #FFA43A;

function ls_set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }
const pad = n => String(n).padStart(2, '0');

const kdate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const nextDays = n => Array.from({ length:n }, (_, i) => addDays(new Date(), i));
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60 + m; };

const cmpB = (a, b) => (a.date + a.start).localeCompare(b.date + b.start);
function dayLabel(k, l) {
  if (k === dkey(new Date())) return l.today;

}

/* ═══════════════════ AI ASSISTANT (demo, rule-based) ═══════════════════ */
// Stand-in for the Claude API call: keyword → services, phrase → day/time window.
const AI_RULES = [
  { re:/тормоз|колодк|скрип|brake|squeak|squeal/,                       svc:['b1','b5'] },
  { re:/масл|техобслуж|плановое|фильтр|oil|filter/,                       svc:['m1','m2'] },
  { re:/стук|подвеск|амортиз|руль|уводит|knock|suspens|shock|clunk/,    svc:['su4','d1'] },
  { re:/чек|ошибк|горит|лампоч|check engine|warning light|error code/,  svc:['d1'] },
  { re:/аккум|не завод|стартер|battery|won.?t start|dead/,              svc:['e2','e1'] },
  { re:/полир|керам|детейл|царап|polish|ceramic|detail|scratch/,        svc:['dt1'] },
  { re:/салон|химчист|interior/,                                         svc:['dt4'] },
  { re:/свеч|троит|spark|misfire/,                                       svc:['m5'] },
  { re:/антифриз|перегр|coolant|overheat/,                               svc:['m6'] },
  { re:/развал|alignment/,                                               svc:['su4'] },
  { re:/коробк|акпп|кпп|transmission|gearbox/,                           svc:['d3'] },
];
const MONTHS_RE = ['янв','фев','мар','апр','ма[йя]','июн','июл','авг','сен','окт','ноя','дек'];

function parseWhen(t) {
  let off = null;
  if (/послезавтра|day after tomorrow/.test(t)) off = 2;
  else if (/завтра|tomorrow/.test(t)) off = 1;
  else if (/сегодня|today|tonight/.test(t)) off = 0;
  else {
    const WD = [[/понедельн|monday/,1],[/вторник|tuesday/,2],[/сред[уа]|wednesday/,3],[/четверг|thursday/,4],[/пятниц|friday/,5],[/суббот|saturday|выходн|weekend/,6],[/воскрес|sunday/,0]];
    for (const [re, wd] of WD) if (re.test(t)) { off = (wd - new Date().getDay() + 7) % 7; break; }
    if (off === null) {
      const today = kdate(dkey(new Date()));
      let target = null;
      const dm = t.match(/(\d{1,2})[./](\d{1,2})/);
      if (dm) target = new Date(today.getFullYear(), +dm[2]-1, +dm[1]);
      else {
        const mi = MONTHS_RE.findIndex(m => new RegExp(`(\\d{1,2})\\s*${m}`).test(t));
        const dn = mi >= 0 ? t.match(new RegExp(`(\\d{1,2})\\s*${MONTHS_RE[mi]}`)) : t.match(/(\d{1,2})\s*(?:числа|-?го\b)/);
        if (dn) { target = new Date(today.getFullYear(), mi >= 0 ? mi : today.getMonth(), +dn[1]); if (mi < 0 && target < today) target.setMonth(target.getMonth()+1); }
      }
      if (target) { if (target < today) target.setFullYear(target.getFullYear()+1); const d = Math.round((target - today)/86400000); if (d >= 0 && d < 14) off = d; }
    }
  }
  let from = 0, to = 24*60;
  if (/утр|morning/.test(t)) { to = 12*60; }
  else if (/после обеда|обед|днём|днем|afternoon|lunch/.test(t)) { from = 12*60; to = 16*60; }
  else if (/вечер|evening|tonight|после работы|after work/.test(t)) { from = 16*60; }
  const tm = t.match(/(?:\sв|\sк|at|after|после)\s*(\d{1,2})(?::(\d{2}))?(?![\d./])|(\d{1,2}):(\d{2})/);
  if (tm) { const h = +(tm[1] ?? tm[3]); if (h >= 7 && h <= 21) { from = h*60 + +(tm[2] ?? tm[4] ?? 0); to = 24*60; } }
  return { off, from, to };
}

function findSlot(db, dur, dayKeys, from, to) {
  for (let i = 0; i < dayKeys.length; i++) {
    const s = freeSlots(db, dayKeys[i], dur).find(x => x.box && toMin(x.time) >= from && toMin(x.time) < to);
    if (s) return { date: dayKeys[i], time: s.time, box: s.box, idx: i };
  }
  return null;
}

function aiPlan(text, db, l) {
  const t = ' ' + text.toLowerCase();
  let ids = [];
  AI_RULES.forEach(r => { if (r.re.test(t)) r.svc.forEach(id => { if (!ids.includes(id)) ids.push(id); }); });
  const unsure = !ids.length;
  let svcs = (unsure ? ['d1'] : ids).map(id => svcById(l, db, id)).filter(s => s && !s.off);
  if (!svcs.length) svcs = [svcById(l, db, 'd1')];
  const dur = svcs.reduce((s, x) => s + x.dur, 0);
  const total = svcs.reduce((s, x) => s + x.price, 0);
  const { off, from, to } = parseWhen(t);
  const days = nextDays(14).map(dkey).slice(off ?? 0);
  const found = findSlot(db, dur, days, from, to) || findSlot(db, dur, days, 0, 24*60);
  const parts = [unsure ? l.ai_unsure : l.ai_found(svcs.map(s => s.name).join(', '), fmtDur(dur, l), fmt(total))];
  if (!found) return { text: [...parts, l.ai_none].join('\n\n') };
  if (off !== null && found.idx > 0) parts.push(l.ai_moved);
  parts.push(l.ai_slot(dayLabel(found.date, l), found.time, found.box));
  return { text: parts.join('\n\n'), offer: { date: found.date, time: found.time, box: found.box, svc: svcs.map(s => s.id), dur, total } };
}

function nextSlotAfter(db, o) {
  for (const k of nextDays(14).map(dkey).filter(k => k >= o.date)) {
    const s = freeSlots(db, k, o.dur).find(x => x.box && (k > o.date || x.time > o.time));
    if (s) return { date: k, time: s.time, box: s.box };
  }
  return null;
}

function useToast() {
  const [s, setS] = useState({ show:false, msg:'' });
  const t = useRef(null);
  const fire = m => { if(t.current) clearTimeout(t.current); setS({show:true,msg:m}); t.current=setTimeout(()=>setS(p=>({...p,show:false})),2400); };
  return [s, fire];
}

    if (!ok) return;
    const saved = Object.fromEntries(Object.entries(form).map(([k, v]) => [k, String(v ?? '').trim()]));
    saved.mileage = saved.mileage.replace(/\D/g, '');

    <div>
      <label className="field-label">{label}</label>
      <input className={`field ${extra.mono ? 'mono' : ''}`} placeholder={ph} value={form[k]} inputMode={extra.inputMode}
        maxLength={extra.max || 40} onChange={e => set(k, extra.upper ? e.target.value.toUpperCase() : e.target.value)} />

  );
  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

        <div className="px" style={{ paddingTop:8, paddingBottom:20 }}>

// Install GARAGE as a regular app: an icon that opens full-screen, without Telegram or the browser bar.
// Inside Telegram the app is first opened in the phone's browser, where the system can install it.
function InstallCard() {
  const { l } = useLang();
  const [can, setCan] = useState(!!deferredInstall);
  const [tgIcon, setTgIcon] = useState('');
  useEffect(() => {
    const on = () => setCan(true);
    window.addEventListener('garage-installable', on);
    // Older Telegram versions (and the SDK outside Telegram) throw on this call instead of ignoring it.
    try { if (TG?.initData && TG.isVersionAtLeast?.('8.0')) TG.checkHomeScreenStatus(st => setTgIcon(st || '')); } catch {}
    return () => window.removeEventListener('garage-installable', on);
  }, []);
  if (IS_STANDALONE) return null;

  const inTg = !!TG?.initData;
  const webUrl = ROLE === 'owner' ? ownerLink(TENANT) : clientLink(TENANT);
  const iosSafari = IS_IOS && /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios|yabrowser/i.test(navigator.userAgent);
  const tgHomeOk = inTg && typeof TG.addToHomeScreen === 'function' && TG.isVersionAtLeast?.('8.0') && tgIcon !== 'added' && tgIcon !== 'unsupported';

  const install = async () => { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; setCan(false); };
  const openInBrowser = () => { try { TG.openLink(webUrl, { try_instant_view:false }); } catch { window.open(webUrl, '_blank'); } };

  let hint, action = null;
  if (inTg) { hint = IS_IOS ? l.install_tg_ios : l.install_tg_android; action = <button className="btn btn-primary btn-sm" style={{ width:'auto' }} onClick={openInBrowser}>{l.install_tg_btn}</button>; }
  else if (can) { hint = l.install_sub; action = <button className="btn btn-primary btn-sm" style={{ width:'auto' }} onClick={install}>{l.install_btn}</button>; }
  else if (iosSafari) hint = l.install_ios;
  else if (IS_IOS) hint = l.install_ios_other;
  else hint = l.install_other;

  return (
    <div className="card install-card">
      <div style={{ display:'flex', alignItems:'center', gap:12 }}>
        <img src="/icons/icon-192.png" alt="" width="44" height="44" style={{ borderRadius:12, flexShrink:0 }} />
        <div style={{ flex:1, minWidth:0 }}>
          <p style={{ fontSize:13.5, fontWeight:600 }}>{l.install_title}</p>
          <p style={{ fontSize:11.5, color:'var(--gray)', marginTop:3, lineHeight:1.45 }}>{hint}</p>
        </div>
      </div>
      {(action || tgHomeOk) && (
        <div style={{ display:'flex', gap:6, marginTop:12 }}>
          {action}
          {tgHomeOk && <button className="btn btn-ghost btn-sm" style={{ width:'auto' }} onClick={() => { try { TG.addToHomeScreen(); } catch {} }}>{l.install_tg_icon}</button>}
        </div>
      )}
    </div>
  );
}

  const [busy,  setBusy]  = useState(false);
  const [consent, setConsent] = useState(false);
  const [done,  setDone]  = useState(null);
  const [toast, fireToast]= useToast();

  useEffect(() => { if (profile.phone && !phone) setPhone(profile.phone); }, [profile.phone]);

  const total = svcs.reduce((s,x) => s + x.price, 0);
  const dur   = svcs.reduce((s,x) => s + x.dur, 0);
  const slots = date ? freeSlots(db, date, dur) : [];
  const slot  = slots.find(s => s.time === time);
  const phoneOk = phone.replace(/\D/g, '').length >= 10;
  const toggleSvc = svc => setSvcs(p => p.find(x => x.id === svc.id) ? p.filter(x => x.id !== svc.id) : [...p, svc]);
  const reset = () => { setDone(null); setStep(1); setCat(null); setSvcs([]); setDate(null); setTime(null); };

  const confirm = async () => {
    if (busy) return;
    setBusy(true);
    const r = await dispatch({ type:'book', data:{ date, start:time, svc:svcs.map(s => s.id), name:name.trim(), phone:phone.trim(), car:carBrief(car), src:'app', consent } });
    setBusy(false);
    if (r.error) {
      fireToast(r.error === 'slot_taken' ? l.slot_taken : l.net_error);
      if (r.error === 'slot_taken') { setTime(null); setStep(3); }
      return;
    }
    TG?.HapticFeedback?.notificationOccurred?.('success');
    onBooked(r.booking);
    setDone(r.booking);
  };

  if (done) return <BookingDone b={done} onMine={onMine} onNew={reset} />;

  const stepNames = [l.step1_name, l.step2_name, l.step3_name, l.step4_name];
  const anyFree = slots.some(s => s.box);

  return (
    <div className="screen">
      <div className="px" style={{ paddingTop:16, paddingBottom:16, borderBottom:'1px solid var(--border)' }}>
        <p className="label" style={{ marginBottom:5 }}>{l.book_title}</p>
        <div style={{ display:'flex', alignItems:'baseline', gap:8, marginBottom:14 }}>
          <h2 style={{ fontSize:21, fontWeight:700 }}>{l.step_label} {step} {l.step_of} 4</h2>
          <span style={{ fontSize:12, color:'var(--gray)' }}>- {stepNames[step-1]}</span>
        </div>
        <div style={{ display:'flex', gap:5 }}>
          {[1,2,3,4].map(s => <div key={s} className={`sdot ${s===step?'on':s<step?'done':''}`} style={{ width:s===step?undefined:8 }} />)}
        </div>
      </div>

      <div className="px" style={{ paddingTop:18 }}>
        {step===1 && (
          <div style={{ animation:'slideUp .35s cubic-bezier(.16,1,.3,1) both' }}>
            <button className="ai-card" onClick={onOpenAI}>
              <span className="cat-ic" style={{ color:'var(--cyan)' }}><Icon name="sparkle" size={19} /></span>
              <div style={{ flex:1 }}>
                <p className="label" style={{ color:'var(--cyan)', marginBottom:3 }}>{l.ai_card_title}</p>
                <p style={{ fontSize:12.5, lineHeight:1.4 }}>{l.ai_card_sub}</p>
              </div>
              <span style={{ color:'var(--cyan)' }}><Icon name="arrow" size={18} /></span>
            </button>
            <p className="label" style={{ marginBottom:12 }}>{l.select_category}</p>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
              {l.cats.map(c => (
                <button key={c.id} className={`cat-btn ${cat===c.id?'on':''}`}
                  onClick={() => { setCat(c.id); setSvcs([]); setTimeout(() => setStep(2), 180); }}>
                  <span className="cat-ic"><Icon name={CAT_ICON[c.id]} size={19} /></span>
                  <div style={{ textAlign:'left' }}>
                    <p style={{ fontSize:11.5, fontWeight:700, letterSpacing:'.05em', color:cat===c.id?'var(--accent)':'var(--white)' }}>{c.label}</p>
                    <p style={{ fontSize:10, color:'var(--gray)', marginTop:2 }}>{c.sub}</p>
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}

        {step===2 && cat && (
          <div style={{ animation:'slideUp .35s cubic-bezier(.16,1,.3,1) both' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12 }}>
              <p className="label">{l.cats.find(c => c.id===cat)?.label}</p>
              <button className="link-btn" onClick={() => { setCat(null); setSvcs([]); setStep(1); }}>{l.back}</button>
            </div>
            {svcList(l, db, cat).filter(s => !s.off).map(svc => {
              const on = !!svcs.find(x => x.id === svc.id);
              return (
                <div key={svc.id} className={`check-item ${on?'on':''}`} onClick={() => toggleSvc(svc)}>
                  <div className={`checkbox ${on?'on':''}`}>{on && <span style={{ fontSize:10, fontWeight:900 }}>✓</span>}</div>
                  <div style={{ flex:1 }}>
                    <p style={{ fontSize:13, fontWeight:500 }}>{svc.name}</p>
                    <p className="mono" style={{ fontSize:10, color:'var(--gray)', marginTop:3 }}>⏱ {fmtDur(svc.dur, l)}</p>
                  </div>
                  <span className="mono" style={{ fontSize:12.5, color:on?'var(--accent)':'var(--gray)', whiteSpace:'nowrap' }}>{fmt(svc.price)}</span>
                </div>
              );
            })}
            <div style={{ position:'sticky', bottom:0, background:'var(--bg)', borderTop:'1px solid var(--border)', paddingTop:14, marginTop:14, paddingBottom:4 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div>
                  <p className="label" style={{ marginBottom:3 }}>{l.services_selected(svcs.length)}{dur ? ` · ${fmtDur(dur, l)}` : ''}</p>
                  <p style={{ fontSize:24, fontWeight:700 }}>{total > 0 ? fmt(total) : <span style={{ color:'var(--gray)' }}>-</span>}</p>
                </div>
                <button className="btn btn-primary btn-sm" style={{ width:'auto', opacity:svcs.length?1:.3, pointerEvents:svcs.length?'auto':'none' }}
                  onClick={() => { setTime(null); setStep(3); }}>{l.next}</button>
              </div>
            </div>
          </div>
        )}

        {step===3 && (
          <div style={{ animation:'slideUp .35s cubic-bezier(.16,1,.3,1) both' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:14 }}>
              <p className="label">{l.date_time} · {fmtDur(dur, l)}</p>
              <button className="link-btn" onClick={() => setStep(2)}>{l.back}</button>
            </div>
            <DateStrip value={date} onChange={d => { setDate(d); setTime(null); }} />
            {date && !anyFree && <p style={{ fontSize:12.5, color:'var(--gray)', padding:'18px 0', textAlign:'center' }}>{l.no_slots}</p>}
            {date && anyFree && (
              <div style={{ animation:'fadeIn .25s ease both' }}>
                <p className="label" style={{ marginBottom:9 }}>{l.times_label} - {dayLabel(date, l)}</p>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:4, marginBottom:16 }}>
                  {slots.map(s => (
                    <div key={s.time} className={`tslot ${time===s.time?'sel':''} ${s.box?'':'na'}`} onClick={() => s.box && setTime(s.time)}>{s.time}</div>
                  ))}
                </div>
              </div>
            )}
            <button className="btn btn-primary" disabled={!slot?.box} style={{ opacity:slot?.box?1:.3 }} onClick={() => setStep(4)}>
              {slot?.box ? `${l.next} ${dayLabel(date, l)} · ${time}` : l.next}
            </button>
          </div>
        )}

        {step===4 && slot && (
          <div style={{ animation:'slideUp .35s cubic-bezier(.16,1,.3,1) both' }}>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom:12 }}>
              <p className="label">{l.contacts}</p>
              <button className="link-btn" onClick={() => setStep(3)}>{l.back}</button>
            </div>
            <div style={{ marginBottom:8 }}>
              <label className="field-label">{l.your_name}</label>
              <input className="field" placeholder={l.name_ph} value={name} onChange={e => setName(e.target.value)} />
            </div>
            <div style={{ marginBottom:8 }}>
              <label className="field-label">{l.your_phone}</label>
              <input className="field mono" type="tel" placeholder={l.phone_ph} value={phone} onChange={e => setPhone(e.target.value)} />
            </div>
            {canSharePhone && !profile.phone && <button className="btn btn-ghost btn-sm" style={{ marginBottom:8 }} onClick={() => onRequestPhone()}>{l.share_tg_phone}</button>}

            <div className="card" style={{ padding:'12px 14px', margin:'8px 0', display:'flex', alignItems:'center', gap:12 }}>
              <span className="cat-ic"><Icon name="car" size={18} /></span>
              <span style={{ flex:1, minWidth:0, fontSize:13 }}>
                {car ? <>{carLine(car)}{car.plate && <span className="mono" style={{ color:'var(--gray)' }}> · {car.plate}</span>}</>
                  : <span style={{ color:'var(--gray)' }}>{l.car_empty_title}</span>}
              </span>
              <button className="link-btn" onClick={onAddCar}>{car ? <Icon name="edit" size={15} /> : l.car_add}</button>
            </div>

            <div className="card" style={{ padding:14, margin:'0 0 16px' }}>
              <p className="label" style={{ marginBottom:10 }}>{l.booking_summary}</p>
              {svcs.map(s => (
                <div key={s.id} style={{ display:'flex', justifyContent:'space-between', marginBottom:6 }}>
                  <span style={{ fontSize:11.5, color:'var(--gray)', flex:1, paddingRight:8 }}>{s.name}</span>
                  <span className="mono" style={{ fontSize:11.5 }}>{fmt(s.price)}</span>
                </div>
              ))}
              <div style={{ borderTop:'1px solid var(--border)', paddingTop:10, marginTop:6, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <span className="mono" style={{ fontSize:11, color:'var(--gray)' }}>{dayLabel(date, l)} · {time} · {l.box} {slot.box}</span>
                <span style={{ fontSize:20, fontWeight:700 }}>{fmt(total)}</span>
              </div>
            </div>
            <ConsentRow checked={consent} onChange={setConsent} />
            <button className="btn btn-primary" disabled={!name.trim() || !phoneOk || !consent || busy} style={{ opacity:name.trim()&&phoneOk&&consent&&!busy?1:.3, gap:10 }} onClick={confirm}>
              {busy && <div className="spinner" style={{ borderTopColor:'#0A0A0B' }} />}{l.confirm_booking}
            </button>
          </div>
        )}
      </div>
      <div className={`toast ${toast.show?'show':''}`}>{toast.msg}</div>
    </div>
  );
}

function BookingDone({ b, onMine, onNew }) {
  const { l } = useLang();
  const { db } = useDB();
  const live = db.bookings.find(x => x.id === b.id) || b;
  const rows = [
    [l.date_lbl, dayLabel(b.date, l)], [l.time_lbl, `${b.start}-${toHM(toMin(b.start) + b.dur)}`],
    [l.box, `#${b.box}`], [l.total_lbl, fmt(b.total)],
  ];
  return (
    <div className="screen">
      <div className="px" style={{ paddingTop:30 }}>
        <div className="done-badge">✓</div>
        <p className="label" style={{ marginBottom:5 }}>{l.booking_no}{b.id}</p>
        <h2 style={{ fontSize:26, fontWeight:700, marginBottom:16 }}>{l.booking_done_title}</h2>
        <div className="card" style={{ marginBottom:14 }}>
          {rows.map(([k, v]) => (
            <div className="spec-row" key={k}><span className="label">{k}</span><span className="mono" style={{ fontSize:12 }}>{v}</span></div>
          ))}
          <div className="spec-row"><span className="label">{l.status_lbl}</span><StatusChip s={liveStatus(live)} /></div>
        </div>
        <p style={{ fontSize:12.5, color:'var(--gray)', lineHeight:1.55, marginBottom:18 }}>{l.owner_notified}</p>
        <button className="btn btn-primary" style={{ marginBottom:6 }} onClick={onMine}>{l.my_bookings_btn}</button>
        <button className="btn btn-ghost" onClick={onNew}>{l.new_booking_btn}</button>
      </div>
    </div>
  );
}

/* ═══════════════════ AI ASSISTANT SHEET ═══════════════════ */
function AssistantSheet({ onClose, tgUser, profile, car, canSharePhone, onRequestPhone, onBooked }) {
  const { l } = useLang();
  const { db, dispatch } = useDB();
  const tgName = tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : '';
  const [msgs, setMsgs]     = useState([{ from:'ai', text:l.ai_hello }]);
  const [input, setInput]   = useState('');
  const [typing, setTyping] = useState(false);
  const [name, setName]     = useState(profile.name || tgName);
  const [phone, setPhone]   = useState(profile.phone);
  const [busy, setBusy]     = useState(false);
  const endRef = useRef(null);
  const dbRef = useRef(db); dbRef.current = db;
  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [msgs, typing]);
  useEffect(() => { if (profile.phone && !phone) setPhone(profile.phone); }, [profile.phone]);
  const contactOk = name.trim() && phone.replace(/\D/g, '').length >= 10;

  const say = (text, offer) => setMsgs(m => [...m, { from:'ai', text, offer }]);
  const send = text => {
    if (!text.trim() || typing) return;
    setMsgs(m => [...m, { from:'me', text }]); setInput(''); setTyping(true);
    setTimeout(() => { const r = aiPlan(text, dbRef.current, l); setTyping(false); say(r.text, r.offer); }, 800);
  };
  const patchOffer = (i, patch) => setMsgs(m => m.map((x, j) => j === i ? { ...x, offer:{ ...x.offer, ...patch } } : x));
  const other = i => {
    const n = nextSlotAfter(dbRef.current, msgs[i].offer);
    if (n) patchOffer(i, n); else say(l.ai_no_more);
  };
  const book = async i => {
    if (!contactOk || busy) return;
    const o = msgs[i].offer;
    setBusy(true);
    const r = await dispatch({ type:'book', data:{ date:o.date, start:o.time, svc:o.svc, name:name.trim(), phone:phone.trim(), car:carBrief(car), src:'ai', consent:true } });
    setBusy(false);
    if (r.error === 'slot_taken') { say(l.slot_taken); other(i); return; }
    if (r.error) { say(l.net_error); return; }
    patchOffer(i, { booked:r.booking.id });
    say(l.ai_booked(r.booking.id));
    TG?.HapticFeedback?.notificationOccurred?.('success');
    onBooked?.(r.booking);
  };

  return (
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-sheet" style={{ height:'88vh', display:'flex', flexDirection:'column', overflow:'hidden', paddingBottom:0 }}>
        <div className="modal-handle" />
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 16px 12px', borderBottom:'1px solid var(--border)' }}>
          <div>
            <h2 style={{ fontSize:17, display:'flex', alignItems:'center', gap:8 }}><span style={{ color:'var(--cyan)' }}><Icon name="sparkle" size={17} /></span>{l.ai_title2}</h2>
            <p style={{ fontSize:11.5, color:'var(--gray)', marginTop:3 }}>{l.ai_sub2}</p>
          </div>
          <button onClick={onClose} style={{ background:'none', border:'none', color:'var(--gray)', fontSize:20, cursor:'pointer' }}>✕</button>
        </div>
        <div className="chat">
          {msgs.map((m, i) => (
            <div key={i} className={`msg ${m.from}`}>
              {m.text}
              {m.offer && (
                <div className="offer">
                  <div className="mono" style={{ fontSize:11.5, marginBottom:m.offer.booked?0:9, color:'var(--accent)' }}>
                    {dayLabel(m.offer.date, l)} · {m.offer.time} · {l.box} {m.offer.box} · {fmt(m.offer.total)}
                  </div>
                  {m.offer.booked
                    ? <span className="chip ok" style={{ marginTop:8 }}>✓ #{m.offer.booked}</span>
                    : <>
                        {(!profile.name || !profile.phone) && (
                          <div style={{ display:'grid', gap:6, marginBottom:8 }}>
                            <p style={{ fontSize:11.5, color:'var(--gray)' }}>{l.ai_contact}</p>
                            <input className="field" style={{ padding:'10px 12px', fontSize:13 }} placeholder={l.your_name} value={name} onChange={e => setName(e.target.value)} />
                            <input className="field mono" style={{ padding:'10px 12px', fontSize:13 }} type="tel" placeholder={l.phone_ph} value={phone} onChange={e => setPhone(e.target.value)} />
                            {canSharePhone && !phone && <button className="btn btn-ghost btn-sm" onClick={() => onRequestPhone()}>{l.share_tg_phone}</button>}
                          </div>
                        )}
                        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:4 }}>
                          <button className="btn btn-primary btn-sm" disabled={!contactOk || busy} style={{ opacity:contactOk && !busy ? 1 : .35 }} onClick={() => book(i)} title={l.consent_ai}>{l.ai_book}</button>
                          <button className="btn btn-ghost btn-sm" onClick={() => other(i)}>{l.ai_other}</button>
                        </div>
                        <p style={{ fontSize:10.5, color:'var(--gray)', marginTop:7, lineHeight:1.4 }}>{l.consent_ai}</p>
                      </>}
                </div>
              )}
            </div>
          ))}
          {typing && <div className="msg ai typing"><span /><span style={{ animationDelay:'.2s' }} /><span style={{ animationDelay:'.4s' }} /></div>}
          <div ref={endRef} />
        </div>
        {msgs.length <= 1 && <div className="ai-chips">{l.ai_chips.map(c => <button key={c} onClick={() => send(c)}>{c}</button>)}</div>}
        <form className="chat-input" onSubmit={e => { e.preventDefault(); send(input); }}>
          <input className="field" value={input} onChange={e => setInput(e.target.value)} placeholder={l.ai_ph} />
          <button className="btn btn-primary" style={{ width:52, padding:0, flexShrink:0 }} type="submit">→</button>
        </form>
      </div>
    </div>
  );
}

/* ═══════════════════ OWNER: REQUESTS ═══════════════════ */

      {(isNew || b.status === 'confirmed') && (

          {isNew
            ? <button className="btn btn-primary btn-sm" onClick={() => onStatus(b.id, 'confirmed')}>{l.o_confirm}</button>
            : <button className="btn btn-primary btn-sm" onClick={() => onStatus(b.id, 'done')}>{l.o_done}</button>}
          <button className="btn btn-ghost btn-sm" onClick={() => onStatus(b.id, 'cancelled')}>{l.o_cancel}</button>
          <a className="btn btn-ghost btn-sm" style={{ textDecoration:'none', padding:0 }} href={telHref(b.phone)} aria-label={l.call}><Icon name="phone" size={16} /></a>
        </div>
      )}
    </div>
  );
}

// The owner corrects the client's details or moves the visit to another free time.
function EditBookingSheet({ b, onClose }) {
  const { l } = useLang();
  const { db, dispatch } = useDB();
  const [f, setF] = useState({ name:b.name || '', phone:b.phone || '', make:b.car?.make || '', model:b.car?.model || '', plate:b.car?.plate || '', date:b.date, start:b.start });
  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]:v }));
  const movable = ['new', 'confirmed'].includes(b.status);
  const others = { ...db, bookings:db.bookings.filter(x => x.id !== b.id) };
  const times = movable ? window.GarageCore.freeSlots(others, f.date, b.dur, new Date()).filter(s => s.box).map(s => s.time) : [];
  if (movable && f.date === b.date && !times.includes(b.start)) times.unshift(b.start);
  const ok = f.name.trim().length >= 2 && f.phone.replace(/\D/g, '').length >= 10 && (!movable || times.includes(f.start));
  const moved = f.date !== b.date || f.start !== b.start;
  const save = async () => {
    if (!ok || busy) return;
    setBusy(true);
    const car = f.make.trim() ? { make:f.make.trim(), model:f.model.trim(), year:b.car?.year || '', plate:f.plate.trim().toUpperCase() } : null;
    const r = await dispatch({ type:'edit', id:b.id, patch:{ name:f.name.trim(), phone:f.phone.trim(), car, date:f.date, start:f.start } });
    setBusy(false);
    if (!r.error) onClose();
  };
  const field = (k, label, extra = {}) => (
    <div>
      <label className="field-label">{label}</label>
      <input className={`field ${extra.mono ? 'mono' : ''}`} value={f[k]} type={extra.type} maxLength={extra.max || 60}
        onChange={e => set(k, extra.upper ? e.target.value.toUpperCase() : e.target.value)} />
    </div>
  );
  // Rendered into <body>: the booking card is animated, and a transformed parent would trap a fixed overlay.
  return ReactDOM.createPortal(
    <div className="modal-backdrop" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-sheet">
        <div className="modal-handle" />
        <div className="px" style={{ paddingTop:8, paddingBottom:20 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', margin:'8px 0 16px' }}>
            <h2 style={{ fontSize:20 }}>{l.o_edit_title(b.id)}</h2>
            <button className="icon-btn" onClick={onClose} aria-label="close"><Icon name="close" size={16} /></button>
          </div>
          <p className="label" style={{ marginBottom:8 }}>{l.o_client}</p>

function OwnerBookings() {
  const { l } = useLang();
  const { db, dispatch } = useDB();
  const today = dkey(new Date()), weekEnd = dkey(addDays(new Date(), 7));
  const real = db.bookings.filter(b => b.status !== 'block');
  const nw = real.filter(b => b.status === 'new').sort((a, b) => b.created - a.created);
  const up = real.filter(b => b.status === 'confirmed' && b.date >= today).sort(cmpB);
  const todayN = real.filter(b => b.date === today && b.status !== 'cancelled').length;
  const rev = real.filter(b => b.status !== 'cancelled' && b.date >= today && b.date <= weekEnd).reduce((s, b) => s + b.total, 0);
  const setStatus = (id, status) => dispatch({ type:'status', id, status });
  return (
    <div className="screen">
      <ScreenHead label={l.owner} title={l.o_title}>

            <div key={k} style={{ flex:1, borderRight:i<2?'1px solid var(--border)':'none', paddingLeft:i?12:0, paddingRight:12 }}>
              <p className="label" style={{ marginBottom:4 }}>{k}</p>

function OwnerSchedule() {
  const { l } = useLang();
  const { db, dispatch } = useDB();
  const [date, setDate] = useState(dkey(new Date()));
  const { boxes, open, close } = db.settings;
  const o = toMin(open), c = toMin(close), PX = 0.9, HEAD = 28;
  const closed = db.closed.includes(date);
  const dayB = db.bookings.filter(b => b.date === date && b.status !== 'cancelled');
  const hours = []; for (let h = Math.ceil(o/60); h*60 < c; h++) hours.push(h);
  const hourOpts = Array.from({ length:17 }, (_, i) => toHM((6 + i) * 60));
  const height = (c - o) * PX + HEAD;

  const toggleDay = () => dispatch({ type:'toggleDay', date });
  const toggleBlock = box => dispatch({ type:'toggleBlock', date, box });
  const setS = patch => dispatch({ type:'settings', patch });

  return (
    <div className="screen">
      <ScreenHead label={l.owner} title={l.o_schedule} />
      <div className="px" style={{ paddingTop:16 }}>
        <DateStrip value={date} onChange={setDate} owner />
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
          <p className="label">{dayLabel(date, l)}</p>
          <button className={`btn btn-sm ${closed ? 'btn-primary' : 'btn-ghost'}`} style={{ width:'auto' }} onClick={toggleDay}>
            {closed ? l.o_open_day : l.o_close_day}
          </button>
        </div>

        {closed ? (
          <div className="card" style={{ padding:'34px 14px', textAlign:'center', color:'var(--gray)', marginBottom:16 }}>{l.o_day_closed}</div>
        ) : (
          <div className="tl" style={{ marginBottom:16 }}>
            <div className="tl-hours" style={{ height }}>
              {hours.map(h => <span key={h} className="tl-hour" style={{ top:HEAD + (h*60 - o) * PX }}>{pad(h)}:00</span>)}
            </div>
            {Array.from({ length:boxes }, (_, i) => i + 1).map(box => {
              const blocked = dayB.some(b => b.box === box && b.status === 'block');
              return (
                <div key={box} className="tl-col" style={{ height }}>
                  <div className="tl-head">
                    <span>{l.box.toUpperCase()} {box}</span>
                    <button className="link-btn" style={{ fontSize:9, fontWeight:700, color:blocked?'var(--accent)':undefined }} onClick={() => toggleBlock(box)}>
                      {blocked ? l.o_unblock : l.o_block}
                    </button>
                  </div>
                  {hours.map(h => <div key={h} className="tl-line" style={{ top:HEAD + (h*60 - o) * PX }} />)}
                  {dayB.filter(b => b.box === box).map(b => {
                    const s = Math.max(toMin(b.start), o), e = Math.min(toMin(b.start) + b.dur, c);
                    if (e <= s) return null;
                    const cls = b.status === 'block' ? 'block' : b.status === 'new' ? 'new' : '';
                    return (
                      <div key={b.id} className={`tl-block ${cls}`} style={{ top:HEAD + (s - o) * PX, height:Math.max((e - s) * PX, 18) }}>
                        {b.status === 'block'
                          ? <span className="label" style={{ fontSize:8.5 }}>{l.o_blocked}</span>
                          : <><b className="mono">{b.start}</b> {b.name}<br /><span style={{ color:'var(--gray)' }}>{svcNames(b.svc, l, db)}</span></>}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        )}

        <p className="label" style={{ marginBottom:9 }}>{l.o_settings}</p>
        <div className="card">
          <div className="spec-row">
            <span style={{ fontSize:13 }}>{l.o_boxes}</span>
            <div className="stepper">
              <button onClick={() => setS({ boxes:Math.max(1, boxes - 1) })}>−</button>
              <span>{boxes}</span>
              <button onClick={() => setS({ boxes:Math.min(4, boxes + 1) })}>+</button>
            </div>
          </div>
          <div className="spec-row">
            <span style={{ fontSize:13 }}>{l.o_hours}</span>
            <div style={{ display:'flex', gap:4, alignItems:'center' }}>
              <select className="mini-field" style={{ width:72 }} value={open} onChange={e => setS({ open:e.target.value })}>
                {hourOpts.filter(h => h < close).map(h => <option key={h}>{h}</option>)}
              </select>
              <span style={{ color:'var(--gray)' }}>-</span>
              <select className="mini-field" style={{ width:72 }} value={close} onChange={e => setS({ close:e.target.value })}>
                {hourOpts.filter(h => h > open).map(h => <option key={h}>{h}</option>)}
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// Text field that saves on blur / Enter instead of on every keystroke (each save is a server round trip).
function CommitInput({ value, onCommit, normalize = v => v, valid = () => true, className = 'field', ...rest }) {
  const [v, setV] = useState(String(value ?? ''));
  const focused = useRef(false);
  useEffect(() => { if (!focused.current) setV(String(value ?? '')); }, [value]);
  const commit = () => {
    focused.current = false;
    const nv = normalize(v);
    if (!valid(nv)) { setV(String(value ?? '')); return; }
    if (nv !== String(value ?? '')) onCommit(nv);
  };
  return (
    <input className={className} value={v} {...rest}
      onFocus={() => { focused.current = true; }} onChange={e => setV(e.target.value)} onBlur={commit}
      onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); }} />
  );
}

function CopyRow({ label, value, l }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => { try { await navigator.clipboard.writeText(value); } catch {} setCopied(true); setTimeout(() => setCopied(false), 1800); };
  return (
    <div style={{ marginBottom:10 }}>
      <p className="field-label">{label}</p>
      <div className="ref-box">
        <span className="mono" style={{ flex:1, minWidth:0, fontSize:11.5, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{value.replace(/^https?:\/\//, '')}</span>
        <button className="btn btn-ghost btn-sm" style={{ width:'auto', flexShrink:0 }} onClick={copy}>{copied ? l.o_copied : l.o_copy}</button>
      </div>
    </div>
  );
}

// The PIN is never shown or sent back by the server; the owner can only set a new one.
function NewPinField({ onSave, saved }) {
  const { l } = useLang();
  const [a, setA] = useState(''), [b, setB] = useState(''), [err, setErr] = useState(''), [busy, setBusy] = useState(false);
  const ok = /^\d{4}$/.test(a) && a === b;
  const submit = async () => {
    if (!/^\d{4}$/.test(a)) { setErr(l.err_pin); return; }
    if (a !== b) { setErr(l.reg_pin_mismatch); return; }
    setBusy(true);
    const r = await onSave(a);
    setBusy(false);
    if (!r.error) { setA(''); setB(''); setErr(''); }
  };
  return (
    <div>
      <label className="field-label">{l.o_new_pin}{saved && <span style={{ color:'var(--ok)', marginLeft:8 }}>✓ {l.o_pin_changed}</span>}</label>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr auto', gap:6 }}>
        <input className="field mono" type="password" inputMode="numeric" autoComplete="new-password" maxLength={4} placeholder="••••" aria-label={l.o_new_pin}
          value={a} onChange={e => { setA(e.target.value.replace(/\D/g, '')); setErr(''); }} />
        <input className="field mono" type="password" inputMode="numeric" autoComplete="new-password" maxLength={4} placeholder="••••" aria-label={l.reg_pin2}
          value={b} onChange={e => { setB(e.target.value.replace(/\D/g, '')); setErr(''); }} />
        <button className="btn btn-ghost btn-sm" style={{ width:'auto' }} disabled={!ok || busy} onClick={submit}>{l.o_save}</button>
      </div>
      {err && <p style={{ fontSize:11.5, color:'#FF6B6B', marginTop:6 }}>{err}</p>}
    </div>
  );
}

// Where new-booking alerts go, and a test message to make sure they arrive.
function NotifyCard() {
  const { l } = useLang();
  const { db } = useDB();
  const [state, setState] = useState({ busy:false, msg:'', ok:false });
  const tgo = db.settings.ownerTg;
  const who = tgo ? [tgo.name, tgo.username && `@${tgo.username}`].filter(Boolean).join(' · ') : '';
  const test = async () => {
    setState({ busy:true, msg:'', ok:false });
    try {
      const r = await apiCall({ action:'testPush', session:OWNER_SESSION });
      setState({ busy:false, ok:r.ok, msg:r.ok ? l.push_ok : l[`push_${r.why}`] || l.push_fail });
    } catch { setState({ busy:false, ok:false, msg:l.push_fail }); }
  };
  return (
    <>
      <p className="label" style={{ margin:'20px 0 9px' }}>{l.o_notify}</p>
      <div className="card" style={{ padding:14 }}>
        <p style={{ fontSize:12.5, lineHeight:1.5, display:'flex', gap:8 }}>
          <span style={{ color:IS_SHOWCASE || tgo ? 'var(--ok)' : '#FF9F0A' }}>●</span>
          <span>{IS_SHOWCASE ? l.o_notify_showcase : tgo ? l.o_notify_on(who) : l.o_notify_off}</span>
        </p>
        {REMOTE && <button className="btn btn-ghost btn-sm" style={{ marginTop:12 }} disabled={state.busy} onClick={test}>{state.busy ? '…' : l.o_notify_test}</button>}
        {state.msg && <p style={{ fontSize:12, marginTop:8, color:state.ok ? 'var(--ok)' : '#FF6B6B' }}>{state.msg}</p>}
      </div>
    </>
  );
}

// A visit counts once the workshop marks it done, or a confirmed booking whose day has passed.
function useMyVisits() {
  const { db } = useDB();
  const today = todayKey();
  const mine = db.bookings.filter(b => b.key && isMine(b));
  const visits = mine.filter(b => b.status === 'done' || (b.status === 'confirmed' && b.date < today)).sort((a, b) => cmpB(b, a));
  const upcoming = mine.filter(b => ['new', 'confirmed'].includes(b.status) && b.date >= today).sort(cmpB);
  const spent = visits.reduce((s, b) => s + b.total, 0);
  return { visits, upcoming, spent };
}

/* ═══════════════════ OWNER LOGIN ═══════════════════ */
function PinScreen({ onOk, byTelegram }) {
  const { l } = useLang();
  const { db } = useDB();
  const [pin, setPin] = useState('');
  const [phone, setPhone] = useState(() => ls_get(PHONE_KEY, ''));
  const [err, setErr] = useState('');
  const pinRef = useRef(''), phoneRef = useRef(phone), checking = useRef(false);
  phoneRef.current = phone;
  const tgName = tgUser0()?.username;
  const needPhone = !byTelegram && (db.settings.ownerPhoneRequired ?? !!db.settings.ownerPhone);

  // Returns the session token (or 'local' in the in-browser demo), or an error text.
  const check = async auth => {
    if (!REMOTE) return ownerAuthOk(loadDB(), auth, tgUser0()) ? { session:'local' } : { error:l.login_wrong };
    try { const r = await apiCall({ action:'login', auth }); return { session:r.session }; }
    catch (e) {
      if (e.code === 'locked') return { error:l.err_locked };
      if (e.code === 'auth') return { error:l.login_wrong };
      return { error:l.net_error };
    }
  };
  const press = d => {
    if (checking.current || pinRef.current.length >= 4) return;
    if (needPhone && phoneRef.current.replace(/\D/g, '').length < 10) { setErr(l.login_need_phone); return; }
    const p = pinRef.current + d;
    pinRef.current = p; setPin(p); setErr('');
    if (p.length < 4) return;
    checking.current = true;
    setTimeout(async () => {
      const auth = { pin:p, phone:byTelegram ? '' : phoneRef.current.trim() };
      const r = await check(auth);
      checking.current = false;
      if (r.session) {
        if (auth.phone) ls_set(PHONE_KEY, auth.phone);
        TG?.HapticFeedback?.notificationOccurred?.('success'); onOk(r.session); return;
      }
      TG?.HapticFeedback?.notificationOccurred?.('error');
      setErr(r.error);
      setTimeout(() => { pinRef.current = ''; setPin(''); }, 450);
    }, 120);
  };
  const del = () => { if (checking.current) return; pinRef.current = pinRef.current.slice(0, -1); setPin(pinRef.current); };
  useEffect(() => {
    const on = e => { if (e.target.tagName === 'INPUT') return; if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') del(); };
    window.addEventListener('keydown', on);
    return () => window.removeEventListener('keydown', on);
  }, []);

  return (
    <div className="pin-screen">
      <div className="hero-mark" style={{ width:68, height:68, borderRadius:20, marginBottom:18 }}><LogoMark size={36} /></div>
      <h2 style={{ fontSize:21 }}>{l.pin_title}</h2>
      <p style={{ fontSize:12.5, color:'var(--gray)', marginTop:4 }}>{db.settings.shop?.name}</p>
      {byTelegram && <p className="pin-sub">{l.login_by_tg(tgName)}</p>}
      {needPhone && <input className="field mono pin-phone" type="tel" inputMode="tel" autoComplete="tel" placeholder={l.login_phone}
            value={phone} onChange={e => { setPhone(e.target.value); setErr(''); }} aria-label={l.login_phone} />}
      {(err || !byTelegram) && <p className="pin-sub" style={{ color:err ? '#FF6B6B' : undefined }}>{err || l.pin_sub}</p>}
      <div className={`pin-dots ${err === l.login_wrong || err === l.err_locked ? 'shake' : ''}`}>{[0,1,2,3].map(i => <span key={i} className={i < pin.length ? 'on' : ''} />)}</div>
      {IS_SHOWCASE && <div className="pin-showcase">
        <span>{l.pin_showcase}</span>
        <button className="btn btn-primary btn-sm" style={{ width:'auto', padding:'10px 16px', whiteSpace:'nowrap' }}
          onClick={() => { pinRef.current = ''; setPin(''); window.GarageCore.SHOWCASE_PIN.split('').forEach(press); }}>{l.pin_showcase_btn}</button>
      </div>}
      <div className="keypad">
        {['1','2','3','4','5','6','7','8','9','','0','del'].map((k, i) =>
          k === '' ? <span key={i} /> :
          <button key={i} className={k === 'del' ? 'ghost' : ''} onClick={() => k === 'del' ? del() : press(k)} aria-label={k === 'del' ? 'delete' : k}>
            {k === 'del' ? <Icon name="backspace" size={24} /> : k}
          </button>
        )}
      </div>
      {!REMOTE && !IS_SHOWCASE && <p className="pin-demo">{l.pin_demo}</p>}
      <a className="pin-demo" style={{ color:'var(--gray)' }} href={`${appBase()}?app=register`}>{l.login_new}</a>
    </div>
  );
}

/* ═══════════════════ APP ROOT ═══════════════════ */
function App() {
  const isOwner = ROLE === 'owner';
  const tgUser = tgUser0();
  const [db, setDb] = useState(loadDB);
  const byTelegram = isOwner && (OWNER_BY_TG || isOwnerUser(db, tgUser));
  const [authed, setAuthed] = useState(() => !isOwner);
  const [tab,  setTab]  = useState(isOwner ? 'o_bookings' : 'garage');
  const [key,  setKey]  = useState(0);
  const [lang, setLang] = useState(() => ls_get('garage_lang', 'ru'));

  const [car,  setCar]  = useState(() => ls_get(CAR_KEY, null));
  const [showCarSetup, setShowCarSetup] = useState(false);
  const [showAI, setShowAI] = useState(false);

  const [profile, setProfile] = useState(() => ({ name:'', phone:'', phoneVerified:false, ...ls_get(PROFILE_KEY, {}) }));
  const saveProfile = patch => setProfile(p => { const next = { ...p, ...patch }; ls_set(PROFILE_KEY, next); return next; });

  const [offline, setOffline] = useState(false);
  const [synced, setSynced] = useState(!REMOTE);
  const [toast, fireToast] = useToast();

  const l = T[lang];
  const lRef = useRef(l); lRef.current = l;
  const switchLang = newLang => { setLang(newLang); ls_set('garage_lang', newLang); setKey(k => k+1); };

  // Locks the dashboard: the session token is dropped on this device and ended on the server.
  const logout = useCallback(() => {
    const s = OWNER_SESSION;
    OWNER_SESSION = null;
    if (REMOTE && s) apiCall({ action:'logout', session:s }).catch(() => {});
    setAuthed(false); setTab('o_bookings'); setSynced(!REMOTE);
    if (REMOTE) setDb(loadDB());
  }, []);

  const refresh = useCallback(async () => {
    if (!REMOTE) { setDb(loadDB()); return; }
    const session = OWNER_SESSION;
    if (isOwner && !session) return;
    try {
      if (isOwner) {
        // Owner data (client names and phones) stays in memory only, never in the device's storage.
        const res = await apiCall({ action:'owner', session });
        setDb(res.db);
      } else {
        const res = await apiCall({ action:'public', mine:myBookings() });
        ls_set(CACHE_KEY, res.db); setDb(res.db);
      }
      setOffline(false); setSynced(true);
    } catch (e) {
      // A 401 for a token that was already replaced (PIN changed meanwhile) is stale: ignore it.
      if (e.status === 401 && isOwner) { if (session === OWNER_SESSION) logout(); }
      else setOffline(true);
    }
  }, [isOwner, logout]);

  // Auto-lock: 5 minutes in the background or 30 minutes without touching the dashboard.
  useEffect(() => {
    if (!isOwner || !authed) return;
    let last = Date.now(), hiddenAt = null;
    const touch = () => { last = Date.now(); };
    const onVis = () => {
      if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 5 * 60000) logout();
      hiddenAt = null; touch();
    };
    const id = setInterval(() => { if (Date.now() - last > 30 * 60000) logout(); }, 30000);
    ['pointerdown', 'keydown', 'scroll'].forEach(ev => window.addEventListener(ev, touch, { passive:true, capture:true }));
    document.addEventListener('visibilitychange', onVis);
    return () => {
      clearInterval(id); document.removeEventListener('visibilitychange', onVis);
      ['pointerdown', 'keydown', 'scroll'].forEach(ev => window.removeEventListener(ev, touch, { capture:true }));
    };
  }, [isOwner, authed, logout]);

  // Every write goes through here: applied locally in the demo, sent to /api/db with the server.
  const dispatch = useCallback(async op => {
    const fail = r => { if (op.type !== 'book') fireToast(errText(lRef.current, r.error)); return r; };
    const done = r => { if (op.type === 'clientCancel') fireToast(lRef.current.booking_cancelled); else if (op.type === 'edit') fireToast(lRef.current.saved_ok); return r; };
    if (!REMOTE) {
      const next = loadDB();
      const r = applyOp(next, { ...op, today:todayKey() });
      if (r.error) return fail(r);
      ls_set(DB_KEY, next); setDb(next);
      if (r.booking && op.type === 'book') addMine(r.booking);
      return done(r);
    }
    try {
      if (op.type === 'book') {
        const r = await apiCall({ action:'book', data:op.data });
        addMine(r.booking); refresh();
        return r;
      }
      if (op.type === 'clientCancel') {
        const r = await apiCall({ action:'cancel', id:op.id, mine:myBookings() });
        await refresh();
        return done(r);
      }
      setDb(d => { const c = JSON.parse(JSON.stringify(d)); applyOp(c, { ...op, today:todayKey() }); return c; });
      const r = await apiCall({ action:'op', op, session:OWNER_SESSION });
      if (r.session) OWNER_SESSION = r.session;
      setDb(r.db);
      return done(r);
    } catch (e) {
      if (e.status === 401) { logout(); return fail({ error:'auth' }); }
      refresh();
      return fail({ error:e.code || 'network' });
    }
  }, [refresh, logout]);

  useEffect(() => { if (authed) refresh(); }, [authed]);
  useEffect(() => {
    const tick = () => { if (document.visibilityState === 'visible' && authed) refresh(); };
    const id = setInterval(tick, REMOTE ? 5000 : 1500);
    document.addEventListener('visibilitychange', tick);
    const onStorage = e => { if (!REMOTE && e.key === DB_KEY) setDb(loadDB()); };
    window.addEventListener('storage', onStorage);
    return () => { clearInterval(id); document.removeEventListener('visibilitychange', tick); window.removeEventListener('storage', onStorage); };
  }, [authed, refresh]);

  // Owner signed in from Telegram: remember that chat so the server knows where to send new-booking alerts.
  const ownerSynced = useRef(false);
  useEffect(() => {
    if (!isOwner || !authed || !synced || !tgUser?.id || ownerSynced.current || IS_SHOWCASE) return;
    ownerSynced.current = true;
    if (db.settings.ownerTg?.id !== tgUser.id)
      dispatch({ type:'settings', patch:{ ownerTg:{ id:tgUser.id, name:[tgUser.first_name, tgUser.last_name].filter(Boolean).join(' '), username:tgUser.username || '' } } });
  }, [isOwner, authed, synced]);

  const newCount = isOwner ? db.bookings.filter(b => b.status === 'new').length : 0;
  const prevNew = useRef(null);
  useEffect(() => {
    // The first load after sign-in only sets the baseline; alert only on requests that arrive while the dashboard is open.
    if (!authed || !synced) { prevNew.current = null; return; }
    if (prevNew.current !== null && newCount > prevNew.current) { fireToast(l.o_new_toast); TG?.HapticFeedback?.notificationOccurred?.('warning'); }
    prevNew.current = newCount;
  }, [newCount, authed, synced]);

  // First visit to the client app: ask for the car right away.
  useEffect(() => {
    if (!isOwner && !TENANT_MISSING && APP_MODE !== 'register' && !car && !ls_get(CAR_PROMPTED_KEY, false)) { ls_set(CAR_PROMPTED_KEY, true); setShowCarSetup(true); }
  }, []);

  useEffect(() => { initTelegram(); }, []);
  useEffect(() => { if (APP_MODE !== 'register') setManifest(db.settings.shop?.name || ''); }, [db.settings.shop?.name]);

  const canSharePhone = !!TG?.initData && typeof TG.requestContact === 'function' && !!TG.isVersionAtLeast?.('6.9');
  const requestPhone = onDone => {
    if (!canSharePhone) { onDone?.(); return; }
    try {
      TG.requestContact((isShared, res) => {
        const p = res?.responseUnsafe?.contact?.phone_number;
        if (isShared && p) saveProfile({ phone:p.startsWith('+') ? p : '+' + p, phoneVerified:true });
        onDone?.();
      });
    } catch { onDone?.(); }
  };

  const go = useCallback(id => {
    if (id !== tab) { setTab(id); setKey(k => k+1); TG?.HapticFeedback?.selectionChanged?.(); }
  }, [tab]);

  const login = session => { OWNER_SESSION = session; setAuthed(true); };
  const onAuthChanged = patch => { if (patch.phone) ls_set(PHONE_KEY, patch.phone); };
  const forgetMe = async () => {
    if (REMOTE) await apiCall({ action:'forget', mine:myBookings() });
    else { const next = loadDB(); window.GarageCore.forgetClient(next, myBookings(), todayKey()); ls_set(DB_KEY, next); }
    wipeClientData();
    location.reload();
  };
  const resetDemo = async () => { await dispatch({ type:'reset' }); };
  const saveCar = newCar => { setCar(newCar); setShowCarSetup(false); };
  const onBooked = b => saveProfile({ name:b.name, phone:b.phone, phoneVerified:profile.phoneVerified && b.phone === profile.phone });

  const clientNav = [
    { id:'garage',  icon:'garage',   label:l.nav_garage  },
    { id:'booking', icon:'calendar', label:l.nav_book    },
    { id:'history', icon:'book',     label:l.nav_history },
    { id:'loyalty', icon:'star',     label:l.nav_loyalty },
  ];
  const ownerNav = [
    { id:'o_bookings', icon:'inbox',   label:l.o_bookings, badge:newCount },
    { id:'o_schedule', icon:'grid',    label:l.o_schedule },
    { id:'o_services', icon:'sliders', label:l.o_services },
  ];
  const bookingProps = { tgUser, profile, car, canSharePhone, onRequestPhone:requestPhone, onBooked, onAddCar:() => setShowCarSetup(true) };

  let body;
  if (APP_MODE === 'register') body = <RegisterApp />;
  else if (TENANT_MISSING) body = <NotFound />;
  else if (!authed) body = <PinScreen onOk={login} byTelegram={byTelegram} />;
  else body = <>
    <div className="tab-content" key={key}>
      {!isOwner && tab==='garage'  && <GarageTab car={car} onEditCar={() => setShowCarSetup(true)} onBook={() => go('booking')} />}
      {!isOwner && tab==='booking' && <BookingTab onMine={() => go('garage')} onOpenAI={() => setShowAI(true)} {...bookingProps} />}
      {!isOwner && tab==='history' && <ServiceBookTab />}
      {!isOwner && tab==='loyalty' && <LoyaltyTab tgUser={tgUser} profile={profile} canSharePhone={canSharePhone} onRequestPhone={requestPhone} onForget={forgetMe} onProfile={saveProfile} />}
      {isOwner && tab==='o_bookings' && <OwnerBookings />}
      {isOwner && tab==='o_schedule' && <OwnerSchedule />}
      {isOwner && tab==='o_services' && <OwnerServices onReset={resetDemo} onAuthChanged={onAuthChanged} />}
    </div>
    <BottomNav items={isOwner ? ownerNav : clientNav} active={tab} set={go} />
  </>;

  return (
    <DBCtx.Provider value={{ db, dispatch, refresh }}>
    <LangCtx.Provider value={{ l, lang, setLang: switchLang }}>
      <div className="topbar">
        <span className="brand"><LogoMark size={22} />GARAGE</span>
        <span style={{ marginLeft:'auto' }} />
        <div className="seg">
          <button className={lang==='ru'?'on':''} onClick={() => switchLang('ru')}>RU</button>
          <button className={lang==='en'?'on':''} onClick={() => switchLang('en')}>EN</button>
        </div>
        {isOwner && authed && APP_MODE !== 'register' && <button className="icon-btn" onClick={logout} aria-label={l.logout} title={l.logout}><Icon name="logout" size={16} /></button>}
      </div>
      {offline && <div className="offline-bar">{l.net_error}</div>}
      {body}
      {showCarSetup && <CarSetupModal car={car} onSave={saveCar} onClose={() => setShowCarSetup(false)} />}
      {showAI && <AssistantSheet onClose={() => setShowAI(false)} {...bookingProps} onBooked={b => { onBooked(b); fireToast(l.booking_confirmed); }} />}
      <div className={`toast ${toast.show?'show':''}`}>{toast.msg}</div>
    </LangCtx.Provider>
    </DBCtx.Provider>
  );
}

boot().then(() => ReactDOM.createRoot(document.getElementById('root')).render(<App />));
</script>
</body>
</html>
